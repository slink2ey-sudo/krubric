<title>루브릭 점검 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: one question card at a time, a 10-cell rubric-grid progress strip on top, summary sheet at the end */
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --ink:#18212B; --muted:#5B6672; --line:#D5DBE2;
  --accent:#2E3F8F; --accent-soft:#E3E7F7; --mark:#FFE27A;
  --ok:#1E7A4C; --ok-soft:#E1F3E9; --bad:#B4322A; --bad-soft:#FBE6E3;
  --display:"Nanum Myeongjo", "Noto Serif KR", serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171D; --paper:#1A2129; --ink:#E7ECF1; --muted:#9AA6B2; --line:#2D3742;
  --accent:#9CABF2; --accent-soft:#252E4D; --mark:#6B5A12;
  --ok:#6FD3A0; --ok-soft:#173326; --bad:#F2938A; --bad-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171D; --paper:#1A2129; --ink:#E7ECF1; --muted:#9AA6B2; --line:#2D3742;
  --accent:#9CABF2; --accent-soft:#252E4D; --mark:#6B5A12;
  --ok:#6FD3A0; --ok-soft:#173326; --bad:#F2938A; --bad-soft:#3A1E1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.25;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--mark) 58%)}
.sub{color:var(--muted);margin:0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.cell{height:30px;border:1px solid var(--line);background:var(--paper);border-radius:4px;font-size:12px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--body);font-variant-numeric:tabular-nums;padding:0}
.cell.cur{border-color:var(--accent);color:var(--accent);font-weight:700;box-shadow:0 0 0 1px var(--accent)}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qno{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent)}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.q{font-size:18px;font-weight:700;line-height:1.5;margin:0;text-wrap:balance}
.ex{border-left:3px solid var(--line);padding:8px 12px;color:var(--ink);font-size:15px;background:var(--bg);border-radius:0 6px 6px 0}
.ex b{color:var(--muted);font-weight:500;font-size:12px;display:block;letter-spacing:.04em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible,.btn:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt span:last-child{min-width:0}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.fb{border-radius:8px;padding:14px 16px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb strong{font-size:15px} .fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.fb .why{margin:0}
.fb .tip{margin:0;font-size:14px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:8px}
.btn{font:inherit;font-size:15px;font-weight:500;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.score{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:.4em;color:var(--muted)}
.verdict{font-size:17px;font-weight:700;margin:0}
.sumlist{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.sumrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.sumrow .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sumrow .t{min-width:0}
.sumrow .r{font-weight:700} .sumrow .r.ok{color:var(--ok)} .sumrow .r.bad{color:var(--bad)}
.book{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.cover{width:clamp(96px,18vw,150px);height:auto;max-width:100%;border:1px solid var(--line);border-radius:4px;background:#fff;display:block}
.book .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.book .ti{font-size:clamp(16px,2.2vw,22px);font-weight:700;line-height:1.4;margin:0}
.book .au{margin:0;color:var(--muted);font-size:14px}
.ideas{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
body.host .ideas,body.host .book .au{font-size:clamp(15px,1.8vw,20px)}
.src{font-size:12px;color:var(--muted);text-align:center}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top header{flex:1 1 320px;min-width:0}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.mode button{font:inherit;font-size:13px;padding:6px 14px;border:0;background:var(--paper);color:var(--muted);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--paper);font-weight:700}
body.host .wrap{max-width:1040px}
body.host .q{font-size:clamp(22px,3.4vw,34px)}
body.host .opt{font-size:clamp(17px,2.2vw,24px);padding:16px 18px;cursor:default}
body.host .opt .k{width:34px;height:34px;font-size:17px}
body.host .ex{font-size:clamp(16px,2vw,22px)}
body.host .fb{font-size:clamp(16px,1.9vw,21px)} body.host .fb strong{font-size:clamp(17px,2vw,22px)}
body.host .tip{font-size:clamp(14px,1.6vw,18px)!important}
body.host .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:10px}
.hostbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hostbar .sp{flex:1}
.timer{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center;color:var(--accent)}
.timer.end{color:var(--bad)}
details.say{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:15px;color:var(--muted)}
details.say summary{cursor:pointer;font-weight:500}
details.say p{margin:6px 0 0;color:var(--ink)}
.keys{font-size:12px;color:var(--muted)}
.keys kbd{font-family:var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--paper)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
  <header>
    <span class="eyebrow">평가 루브릭의 이해 및 활용 · 도입 활동</span>
    <h1>내 루브릭은 학생의 <em>배움</em>을 보여 주나요?</h1>
    <p class="sub">브룩하트(2013)의 루브릭 원리 10문항 + 경기도 학습으로의 평가 연결 2문항 · 고르면 바로 해설이 나옵니다.</p>
  </header>
  <div class="mode" role="group" aria-label="모드"><button id="mSolo" aria-pressed="true">개인 풀이</button><button id="mHost" aria-pressed="false">진행자 모드</button></div>
  </div>

  <div>
    <div class="grid" id="grid" aria-label="문항 이동"></div>
  </div>
  <div class="legend"><span id="prog">0 / 10 풀이</span><span id="cor">정답 0</span></div>

  <section class="card" id="card" aria-live="polite"></section>

  <p class="src">근거: S. M. Brookhart (2013), <i>How to Create and Use Rubrics for Formative Assessment and Grading</i>, ASCD · 경기도교육청(2025), 「초등 학습으로의 평가 이해하기」</p>
</div>

<script>
const Q=[
{tag:"정의",q:"브룩하트가 말하는 루브릭의 필수 요소 두 가지는?",
 o:["점수 배점과 등급 구간","준거와 준거별 수행 수준 기술","과제 지시문과 채점 기준표","성취기준과 평가 방법"],a:1,
 why:"루브릭은 '무엇을 볼 것인가(준거)'와 '어느 정도인가(수준 기술)'가 함께 있어야 합니다.",
 say:"몸풀기 문제입니다. 손가락으로 번호를 들어 주세요. 정답을 공개한 뒤 '그럼 우수·보통·미흡 칸만 있는 표는?' 하고 되물어 보세요.",tip:"수준 기술 없이 '우수/보통/미흡' 칸만 있는 표는 루브릭이 아니라 평정척도입니다."},
{tag:"준거",q:"사회과 탐구 보고서 루브릭의 준거로 가장 적절한 것은?",
 o:["자료를 3개 이상 활용하였다","표지와 목차를 갖추었다","근거 자료가 주장을 뒷받침한다","제출 기한을 지켰다"],a:2,
 why:"준거는 성취기준에 담긴 학습 결과에서 나와야 합니다. 나머지는 과제 지시사항이나 태도입니다.",
 say:"①을 고르는 분이 꼭 있습니다. '자료 3개를 채웠는데 엉뚱한 자료라면 몇 점 주실 건가요?'로 반박을 부드럽게 받습니다.",tip:"'자료 3개'를 채워도 엉뚱한 자료라면 학습이 일어나지 않은 것입니다."},
{tag:"준거",q:"'내용 이해 / 개념 이해 / 표현'으로 된 준거 세트의 가장 큰 문제는?",
 o:["준거 수가 너무 적다","앞의 두 준거가 겹쳐 같은 약점이 두 번 감점된다","표현은 평가하면 안 된다","준거 이름이 너무 짧다"],a:1,
 why:"준거는 서로 구별되어야(distinct) 합니다. 겹치면 한 가지 약점이 점수에 이중으로 반영됩니다.",
 say:"잠깐 옆 선생님과 10초만 이야기해 보게 하세요. 지도서 루브릭에서 이런 겹침을 찾아오면 실습 과제가 됩니다.",tip:"준거를 정한 뒤 '이 둘을 각각 따로 판단할 수 있는가?'를 물어보세요."},
{tag:"준거",q:"수업 전에 학생에게 미리 나눠주기에 적합한 루브릭은?",
 o:["과제 특수 루브릭: 이 문항의 정답 요소를 그대로 적은 것","일반 루브릭: 같은 유형의 여러 과제에 쓸 수 있는 것","총체적 루브릭: 점수 하나만 주는 것","교사용 채점표: 학생에게는 비공개"],a:1,
 why:"일반 루브릭은 정답을 드러내지 않으면서 '좋은 수행이 무엇인지'를 가르쳐 줍니다.",
 say:"'미리 주면 학생들이 답만 맞춰 쓰지 않나요?'라는 질문이 나오면 반가운 신호입니다. 과제 특수 루브릭이 바로 그런 루브릭이라고 답하세요.",tip:"과제 특수 루브릭은 채점 신뢰도에는 좋지만 미리 주면 답안지가 됩니다."},
{tag:"수준 기술",q:"다음 중 가장 잘 쓴 수준 기술은?",
 o:["주장이 훌륭하다","주장이 적절한 편이다","주장을 분명히 밝히고, 각 근거가 주장과 어떻게 연결되는지 설명한다","주장 부분을 매우 열심히 썼다"],a:2,
 why:"'훌륭하다·적절하다'는 판정만 하는 평가어입니다. 수준 기술은 작품에서 보이는 모습을 써야 합니다.",
 say:"여기서부터 수준 기술입니다. ③을 읽어 주며 '학생 글에 밑줄 그을 수 있나요?'를 물어보세요.",tip:"점검 질문: 이 문장만 보고 학생 작품에서 해당 부분에 밑줄을 그을 수 있는가?"},
{tag:"수준 기술",ex:"상: 맞춤법 오류 2개 이하 / 중: 3~5개 / 하: 6개 이상",q:"다음 예시 루브릭과 같이 개수로 수준을 나눈 기술의 문제로 가장 적절한 것은?",
 o:["채점이 너무 오래 걸린다","개수가 글의 질을 반영하지 못하고, 짧게 쓸수록 유리해진다","오류 개수는 셀 수 없다","수준이 세 개뿐이라 변별이 안 된다"],a:1,
 why:"개수 세기는 객관적으로 보이지만, 그 개수가 질을 대변할 때만 쓸 수 있습니다.",
 say:"'개수가 제일 객관적인데요?'라는 반론이 나오면 '짧게 쓴 학생이 상을 받는 루브릭'의 예를 드세요.",tip:"'오류가 의미 전달을 방해하는가'처럼 오류의 영향을 기술하는 편이 학습에 가깝습니다."},
{tag:"수준 기술",ex:"상: 매우 잘 설명함 / 중: 잘 설명함 / 하: 다소 부족하게 설명함",q:"다음 예시 루브릭과 같은 수준 기술의 가장 큰 문제는?",
 o:["부사만 바뀌어 학생이 수준 간 차이를 알 수 없다","'설명'이라는 단어가 반복된다","하 수준 표현이 학생에게 상처를 준다","수준이 홀수여서 중간으로 몰린다"],a:0,
 why:"'매우·잘·다소'는 교사마다 다르게 읽히는 정도어입니다. 무엇이 달라지는지를 써야 합니다.",
 say:"참가자들 지도서에 가장 많이 나오는 유형입니다. '우리 루브릭 몇 개가 이런가요?'로 웃음을 유도하세요.",tip:"수준을 가르는 것은 정도 부사가 아니라 관찰 가능한 차이입니다. 예: 사실 나열 → 원인 설명 → 원인 간 관계 설명"},
{tag:"수준 기술",q:"수준 간 기술을 쓰는 방법으로 가장 바람직한 것은?",
 o:["상위 수준으로 갈수록 새로운 요소를 하나씩 추가한다","모든 수준이 같은 요소를 다루되, 그 요소의 질이 어떻게 다른지 쓴다","하 수준은 '해당 없음'으로 비워 둔다","상 수준만 자세히 쓰고 나머지는 '상에 미치지 못함'으로 쓴다"],a:1,
 why:"수준마다 같은 측면을 병렬로 다뤄야 연속선상의 질 차이가 드러납니다. 요소가 바뀌면 다른 준거를 평가하게 됩니다.",
 say:"가로 읽기를 시연하세요. 상·중·하 칸을 한 줄로 읽었을 때 같은 질문에 답하는지 보는 것입니다.",tip:"모든 수준 칸을 가로로 읽었을 때 같은 질문에 답하고 있는지 확인하세요."},
{tag:"수준 기술",q:"브룩하트는 4수준 루브릭을 쓸 때 어느 칸부터 쓰라고 할까?",
 o:["가장 높은 4수준(완벽한 모습)","가장 낮은 1수준(실수 목록)","성취기준에 도달한 모습을 나타내는 3수준","어느 칸이든 상관없다"],a:2,
 why:"브룩하트의 4수준 루브릭에서는 목표 수행(proficient)을 먼저 기술해야 성취기준과 정렬됩니다. 그 위아래를 차이로 써 나가면 됩니다.",
 say:"오답이 가장 많이 나오는 문항입니다. 공개 후 75점 환산 이야기를 꺼내되, '경기도 C(보통)는 미도달이냐'는 질문이 나오면 경기 A~D는 성취율 구간 체계라 도달·미도달 선이 없고, 반드시 도달할 선은 기본학력(공통핵심기준)으로 따로 둔다고 답하세요.",tip:"브룩하트 루브릭의 3수준은 '목표 도달'이라서, 4점 만점 3점을 75점으로 환산하면 의미가 왜곡됩니다. 단, 이것은 루브릭 설계 원리이며 경기도 성취수준 A~D(성취율 구간)와는 다른 체계입니다. 경기 C를 '미도달'로 읽지 마세요."},
{tag:"수준 기술",q:"학생이 다음에 무엇을 해야 할지 알 수 있는 하위 수준 기술은?",
 o:["근거가 부족함","노력이 필요함","근거를 제시했으나 주장과의 연결을 설명하지 않음","주장하는 글쓰기가 미흡함"],a:2,
 why:"좋은 수준 기술은 그 자체로 피드백입니다. 학생이 이 문장을 읽고 고칠 지점을 찾을 수 있어야 합니다.",
 say:"마지막 문항입니다. 공개 후 바로 '이 문장 형식으로 지도서 루브릭 한 줄을 고쳐 봅시다'로 실습에 연결하세요.",tip:"하위 수준은 '없는 것'보다 '하고 있는 것'을 먼저 쓰면 학생이 다음 단계를 봅니다."},
{tag:"경기 연결",q:"경기도 '학습으로의 평가'와 브룩하트의 루브릭론의 관계로 가장 적절한 것은?",
 o:["평가관이 서로 달라 함께 쓰기 어렵다","학습으로의 평가는 지향(왜·무엇을)이고, 브룩하트는 그 지향을 채점기준으로 구현하는 방법(어떻게)이다","학습으로의 평가는 총괄평가, 브룩하트는 형성평가만 다룬다","학습으로의 평가에서는 루브릭을 쓰지 않는다"],a:1,
 why:"경기 자료는 평가 기준과 수행 목표를 학생에게 미리 안내해 스스로 점검·조정하게 하라고 합니다. 학생이 읽고 쓸 수 있는 루브릭이 있어야 가능한 일입니다.",
 say:"'오늘 브룩하트 얘기가 우리 도 정책이랑 무슨 상관이냐'는 질문을 미리 꺼내는 문항입니다. 공개 후 '왜는 도교육청이, 어떻게는 브룩하트가'로 한 줄 정리하세요.",
 tip:"학습으로의 평가가 '왜'라면, 브룩하트는 '어떻게'입니다."},
{tag:"경기 연결",ex:"경기도 4단계 성취수준 B: 개념에 대한 이해가 가능하고 지식 전이가 가능함 … 실천과 적용 범위가 보통임",q:"브룩하트 기준으로 보면 '보통임' 같은 정도어가 들어 있습니다. 가장 적절한 활용은?",
 o:["도교육청 자료가 원칙에 어긋나므로 쓰지 않는다","영역 전체를 포괄하는 일반 진술이므로, 과제별 채점기준(표)에서 학생에게 보이는 모습으로 구체화한다","성취수준 문장을 그대로 채점기준표 칸에 옮겨 적는다","브룩하트 원칙은 미국 맥락이라 우리 교실에는 적용하지 않는다"],a:1,
 why:"경기 자료도 성취수준과 채점기준(표)을 구분합니다. 채점기준(표)은 수행의 질을 수준에 따라 구체적인 언어로 기술하는 도구이고, 브룩하트의 원칙은 바로 이 층위에 적용됩니다.",
 say:"'그럼 도교육청 자료가 틀렸다는 거냐'는 반론에 대한 답을 퀴즈가 대신 해 주는 문항입니다. 공개 후 바로 '오늘 실습은 성취수준을 채점기준으로 번역하는 일'이라고 연결하세요.",
 tip:"오늘 실습: 지도서·성취수준의 추상적인 문장을 학생에게 보이는 채점기준으로 번역하기"}
];
const K=["①","②","③","④"];
let cur=0, ans=Array(Q.length).fill(null), done=false;
try{const s=JSON.parse(localStorage.getItem("rq-ans")||"null");if(Array.isArray(s)&&s.length===Q.length)ans=s;}catch(e){}
const save=()=>{try{localStorage.setItem("rq-ans",JSON.stringify(ans))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function grid(){
  const g=$("grid");g.innerHTML="";
  Q.forEach((q,i)=>{const b=document.createElement("button");b.className="cell";b.textContent=i+1;
    b.setAttribute("aria-label",(i+1)+"번 문항");
    if(ans[i]!==null)b.classList.add(ans[i]===q.a?"ok":"bad");
    if(i===cur&&!done)b.classList.add("cur");
    b.onclick=()=>{intro=false;done=false;cur=i;render()};g.appendChild(b)});
  const n=ans.filter(x=>x!==null).length, c=ans.filter((x,i)=>x===Q[i].a).length;
  $("prog").textContent=n+" / "+Q.length+" 풀이";$("cor").textContent="정답 "+c;
}

let host=false, shown=Array(Q.length).fill(false), tLeft=0, tId=null;
function setMode(h){host=h;document.body.classList.toggle("host",h);
  $("mSolo").setAttribute("aria-pressed",!h);$("mHost").setAttribute("aria-pressed",h);
  done=false;intro=true;stopT();render()}
function stopT(){clearInterval(tId);tId=null;tLeft=0}
function startT(){stopT();tLeft=15;drawT();tId=setInterval(()=>{tLeft--;drawT();if(tLeft<=0)clearInterval(tId)},1000)}
function drawT(){const e=$("timer");if(e){e.textContent=tLeft>0?tLeft:(tId?"끝":"");e.classList.toggle("end",tLeft<=0&&!!tId)}}
function hostGrid(){const g=$("grid");g.innerHTML="";
  Q.forEach((q,i)=>{const b=document.createElement("button");b.className="cell";b.textContent=i+1;
    b.setAttribute("aria-label",(i+1)+"번 문항");if(shown[i])b.classList.add("ok");if(i===cur&&!done)b.classList.add("cur");
    b.onclick=()=>{intro=false;done=false;cur=i;stopT();render()};g.appendChild(b)});
  const n=shown.filter(Boolean).length;$("prog").textContent=n+" / "+Q.length+" 공개";$("cor").textContent="진행자 모드"}
function hostRender(){
  hostGrid();const c=$("card");
  if(done){c.innerHTML='<span class="eyebrow">마무리</span><p class="q">퀴즈에서 틀린 문항이 곧 실습 체크리스트입니다.</p><div class="ex"><b>실습 안내</b>가져온 지도서에서 루브릭 한 줄을 골라, 6~10번 기준으로 수준 기술을 고쳐 쓰고 공유 공간에 올려 주세요.</div><div class="hostbar"><button class="btn" id="hb">처음으로</button></div>';

function hNext(){if(!shown[cur]){shown[cur]=true;stopT();return render()}stopT();if(cur===Q.length-1)done=true;else cur++;render()}
function hPrev(){if(cur===0&&!done){intro=true;stopT();return render()}if(cur>0){cur--;done=false;stopT();render()}}
document.addEventListener("keydown",e=>{if(!host||e.target.closest("summary"))return;

  h+='<div class="opts">';
  q.o.forEach((o,i)=>{let cls="opt";if(a!==null){if(i===q.a)cls+=" right";else if(i===a)cls+=" wrong";}
    h+='<button class="'+cls+'" data-i="'+i+'"'+(a!==null?" disabled":"")+'><span class="k">'+(i+1)+'</span><span>'+esc(o)+'</span></button>'});
  h+='</div>';
  if(a!==null){const ok=a===q.a;
    h+='<div class="fb '+(ok?"ok":"bad")+'"><strong>'+(ok?"정답입니다":"정답은 "+K[q.a]+"입니다")+'</strong><p class="why">'+esc(q.why)+'</p><p class="tip">'+esc(q.tip)+'</p></div>';}
  const last=cur===Q.length-1;
  h+='<div class="nav"><button class="btn" id="prev">이전</button>'+
     '<button class="btn primary" id="next"'+(a===null?" disabled":"")+'>'+(last?"결과 보기":"다음 문항")+'</button></div>';
  c.innerHTML=h;
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=+b.dataset.i;save();render()});
  $("prev").onclick=()=>{if(cur===0)intro=true;else cur--;render()};
  $("next").onclick=()=>{if(last){done=true}else cur++;render()};
}
function summary(){
  const c=ans.filter((x,i)=>x===Q[i].a).length;
  const v=c>=11?"루브릭 코치 수준입니다. 모둠에서 동료의 루브릭을 봐 주세요.":c>=8?"탄탄합니다. 틀린 문항의 해설만 다시 보고 실습으로 넘어가세요.":c>=5?"평소 쓰던 루브릭과 다른 점이 보이셨을 겁니다. 실습에서 바로 확인해 봅시다.":"오늘 연수가 가장 쓸모 있을 분입니다. 틀린 문항이 곧 실습 체크리스트입니다.";
  let h='<span class="eyebrow">결과</span><div class="score">'+c+'<small> / '+Q.length+'</small></div><p class="verdict">'+v+'</p><div class="sumlist">';
  Q.forEach((q,i)=>{const ok=ans[i]===q.a,un=ans[i]===null;
    h+='<div class="sumrow"><span class="n">'+(i+1)+'</span><span class="t">'+esc(q.q)+'</span><span class="r '+(un?"":ok?"ok":"bad")+'">'+(un?"—":ok?"정답":"오답")+'</span></div>'});
  h+='</div><p class="tip" style="margin:0;color:var(--muted);font-size:14px">번호 칸을 누르면 해설을 다시 볼 수 있습니다. 이제 가져온 지도서의 루브릭 한 줄을 6~10번 기준으로 고쳐 보세요.</p>';
  h+='<div class="nav"><button class="btn" id="back">해설 다시 보기</button><button class="btn primary" id="reset">다시 풀기</button></div>';
  $("card").innerHTML=h;
  $("back").onclick=()=>{done=false;cur=0;render()};
  $("reset").onclick=()=>{ans=Array(Q.length).fill(null);save();cur=0;done=false;intro=true;render()};
}
$("mSolo").onclick=()=>setMode(false);$("mHost").onclick=()=>setMode(true);
if(location.hash==="#host")setMode(true);else render();
</script>
